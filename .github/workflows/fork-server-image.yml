# Builds this fork's server image and publishes it to GitHub Container
# Registry, so a Docker Compose setup can run the fork's server changes in
# place of codewithcj/sparkyfitness_server.
#
# Branch `fork-server` = an upstream release tag + this fork's server-only
# commits. Image tags:
#   ghcr.io/atj013/sparkyfitness_server:fork           newest build
#   ghcr.io/atj013/sparkyfitness_server:fork-<sha>     one exact build (to pin or roll back)
name: Fork server image (GHCR)

on:
  push:
    branches: [fork-server]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-server-image
  cancel-in-progress: false

jobs:
  build:
    # Only on the fork: upstream publishes its own images.
    if: github.repository_owner == 'atj013'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image tags
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atj013/sparkyfitness_server:fork
            ghcr.io/atj013/sparkyfitness_server:fork-${{ steps.tags.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/atj013/SparkyFitness
            org.opencontainers.image.description=SparkyFitness server (atj013 fork: upstream release + fork server changes)
          cache-from: type=gha
          cache-to: type=gha,mode=max
